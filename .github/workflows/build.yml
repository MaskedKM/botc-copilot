name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      build_apk:
        description: '构建 release APK 并上传 Artifact'
        type: boolean
        default: true

jobs:
  # 质量门禁：分析 + 测试（所有 push/PR 都跑）
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.2
          cache: true

      - name: 安装依赖
        run: flutter pub get

      - name: 生成代码（Drift）
        run: dart run build_runner build --delete-conflicting-outputs

      - name: 静态分析
        run: flutter analyze

      - name: 测试
        run: flutter test

  # 构建 APK（仅手动触发：Actions → build → Run workflow）
  apk:
    if: github.event_name == 'workflow_dispatch'
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.2
          cache: true

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs

      - name: 构建 release APK
        run: flutter build apk --release

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: botc-copilot-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
